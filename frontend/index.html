<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>openGym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="openGym">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<!-- paint the app background before the JS bundle loads (no white flash on launch) -->
<style>html{background:#000}html[data-theme="light"]{background:#f2f2f7}</style>
<script>try{if(JSON.parse(localStorage.getItem('gym_state_v1')).theme==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<!-- iOS Home Screen launch images (iOS ignores the manifest for this) -->
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-750x1334.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1242x2688.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1284x2778.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1320x2868.png">
<link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1260x2736.png">
</head>
<body>
<!-- launch animation: first frame matches the iOS splash, then a rep until React has rendered -->
<style>
#boot{position:fixed;inset:0;z-index:9999;background:#000;color:#a3e635;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#boot svg{width:50vw;max-width:50vh;animation:boot-rep .9s cubic-bezier(.45,0,.3,1) infinite;transition:transform .35s ease}
#boot .o{animation:boot-lag .9s cubic-bezier(.45,0,.3,1) infinite}
#boot.out{opacity:0}#boot.out svg{animation:none;transform:scale(1.25)}
/* the iOS splash is always black, so light theme starts there and shades over */
html[data-theme="light"] #boot{animation:boot-light .6s ease forwards}
@keyframes boot-light{to{background:#f2f2f7;color:#248a3d}}
@keyframes boot-rep{0%,100%{transform:none}45%,55%{transform:translateY(-12%)}}
@keyframes boot-lag{0%,100%{transform:none}50%{transform:translateY(3%)}}
@media (prefers-reduced-motion:reduce){#boot svg,#boot .o{animation:none}}
</style>
<div id="boot" aria-hidden="true"><svg viewBox="0 0 512 512" fill="currentColor"><rect x="80" y="242" width="352" height="28"/><rect x="132" y="169" width="45" height="174"/><rect x="335" y="169" width="45" height="174"/><g class="o"><rect x="80" y="200" width="36" height="112"/><rect x="396" y="200" width="36" height="112"/></g></svg></div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
<script>
(function(){var b=document.getElementById('boot'),ready=false,done=false
function out(){if(done)return;done=true;b.classList.add('out');setTimeout(function(){b.remove()},400)}
// finish the current rep before leaving, so it never cuts mid-lift
b.firstElementChild.addEventListener('animationiteration',function(){if(ready)out()})
addEventListener('DOMContentLoaded',function(){ready=true;if(matchMedia('(prefers-reduced-motion: reduce)').matches)out()})
setTimeout(out,6000)})()
</script>
</body>
</html>
